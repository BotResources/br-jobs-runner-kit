{{- range $ns := include "br-sandbox-chart.namespaces" . | fromJsonArray }}
{{- if $.Values.render_namespace }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns.name }}
  labels:
    {{- include "br-sandbox-chart.labels" $ | nindent 4 }}
    br.sandbox/managed: "true"
    br.sandbox/mode: {{ $ns.mode | quote }}
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
{{- end }}
---
{{ include "br-sandbox-chart.fence.service_account" (dict "root" $ "ns" $ns) }}
{{- end }}
{{- if .Values.operator.enabled }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "br-sandbox-chart.system_namespace" . }}
  labels:
    {{- include "br-sandbox-chart.labels" . | nindent 4 }}
    br.sandbox/system: "true"
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
{{- end }}
