{{- $system := include "br-sandbox-chart.system_namespace" . }}
{{- $namespaces := include "br-sandbox-chart.namespaces" . | fromJsonArray }}
{{- range $ns := $namespaces }}
---
{{ include "br-sandbox-chart.fence.config" (dict "root" $ "ns" $ns) }}
{{- end }}
{{- if .Values.operator.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: br-sandbox-keeper-config
  namespace: {{ $system }}
  labels:
    {{- include "br-sandbox-chart.labels" . | nindent 4 }}
data:
  config.json: |
    {{- include "br-sandbox-chart.keeper.document" . | nindent 4 }}
{{- end }}
{{- include "br-sandbox-chart.slot.keeper.objects" . }}
