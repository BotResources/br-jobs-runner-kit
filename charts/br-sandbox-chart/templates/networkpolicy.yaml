{{- range $ns := include "br-sandbox-chart.namespaces" . | fromJsonArray }}
---
{{ include "br-sandbox-chart.fence.default_deny" (dict "root" $ "ns" $ns) }}
{{- if $ns.egress }}
---
{{ include "br-sandbox-chart.fence.egress_proxy" (dict "root" $ "ns" $ns) }}
{{- else if eq $ns.mode "full" }}
---
{{ include "br-sandbox-chart.fence.egress_full" (dict "root" $ "ns" $ns) }}
{{- end }}
{{- end }}
{{- $system := include "br-sandbox-chart.system_namespace" . }}
{{- if or .Values.operator.enabled .Values.network_check.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: br-sandbox-default-deny
  namespace: {{ $system }}
  labels:
    {{- include "br-sandbox-chart.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
{{- end }}
{{- if .Values.operator.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: br-sandbox-egress-keeper
  namespace: {{ $system }}
  labels:
    {{- include "br-sandbox-chart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      br.sandbox/system: keeper
  policyTypes:
    - Egress
  egress:
    - to:
        {{- range .Values.network.api_server_addresses }}
        - ipBlock:
            cidr: {{ include "br-sandbox-chart.cidr.normalize" . }}
        {{- end }}
    - to:
        {{- range .Values.network.store_cidrs }}
        - ipBlock:
            cidr: {{ include "br-sandbox-chart.cidr.normalize" . }}
        {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
{{- if .Values.network_check.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: br-sandbox-egress-netcheck
  namespace: {{ $system }}
  labels:
    {{- include "br-sandbox-chart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      br.sandbox/system: netcheck
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
{{- end }}
