{{- if .Values.operator.enabled }}
{{- $_ := include "br-sandbox-chart.validate" . }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: br-sandbox-pod
  labels:
    {{- include "br-sandbox-chart.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: sandbox.botresources.ai/v1alpha1
    kind: SandboxPool
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers", "pods/resize"]
  variables:
    - name: role
      expression: {{ "(has(object.metadata.labels) && 'br.sandbox/role' in object.metadata.labels) ? object.metadata.labels['br.sandbox/role'] : ''" | include "br-sandbox-chart.json_string" }}
    - name: oldRole
      expression: {{ "(has(oldObject.metadata.labels) && 'br.sandbox/role' in oldObject.metadata.labels) ? oldObject.metadata.labels['br.sandbox/role'] : ''" | include "br-sandbox-chart.json_string" }}
    - name: containers
      expression: {{ "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])" | include "br-sandbox-chart.json_string" }}
  validations:
    {{- range $rule := include "br-sandbox-chart.vap.rules" (dict "root" $) | fromJsonArray }}
    - expression: {{ $rule.expression | include "br-sandbox-chart.json_string" }}
      message: {{ printf "%s: %s" $rule.code $rule.message | include "br-sandbox-chart.json_string" }}
    {{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: br-sandbox-pod
  labels:
    {{- include "br-sandbox-chart.labels" . | nindent 4 }}
spec:
  policyName: br-sandbox-pod
  validationActions: ["Deny"]
  paramRef:
    selector: {}
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        br.sandbox/managed: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: br-sandbox-pod-update
  labels:
    {{- include "br-sandbox-chart.labels" . | nindent 4 }}
spec:
  policyName: br-sandbox-pod
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        br.sandbox/managed: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers", "pods/resize"]
{{- end }}
