name: ci

on:
  pull_request:
  push:
    branches: [main, "release/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy-test:
    name: cargo fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked

  docs:
    name: cargo doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: docs
      - run: cargo doc --workspace --no-deps --locked

  deny:
    name: cargo-deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check advisories bans licenses sources

  unused-deps:
    name: cargo-machete (unused deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-machete
      - run: cargo machete

  semver:
    name: cargo semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: semver
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-semver-checks
      - name: cargo semver-checks against each tracked crate's previous tag
        run: |
          set -euo pipefail
          source .github/scripts/tracked-libraries.sh
          for crate in $TRACKED_LIBRARIES; do
            bash .github/scripts/semver-check.sh "$crate"
          done
      - name: cargo semver-checks of the frozen crates against the last unified tag
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/tracked-libraries.sh
          baseline=$(git tag --list "v[0-9]*.[0-9]*.[0-9]*" | sort -V | tail -n1)
          if [ -z "$baseline" ]; then
            echo "::notice::no unified workspace tag (v*), skipping the frozen crates"
            exit 0
          fi
          fail=0
          for entry in $FROZEN_CRATES; do
            crate="${entry%@*}"
            if ! git cat-file -e "${baseline}:crates/${crate}/Cargo.toml" 2>/dev/null; then
              echo "::notice::${crate} did not exist at ${baseline}, skipping"
              continue
            fi
            echo "::group::${crate} vs ${baseline}"
            if ! cargo semver-checks -p "${crate}" --baseline-rev "${baseline}"; then
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

  e2e:
    name: e2e (runner transport vs NATS JetStream)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: e2e
      - name: install nats-server
        run: |
          NATS_VERSION="v2.14.1"
          URL="https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/nats-server-${NATS_VERSION}-linux-amd64.tar.gz"
          curl -sSfL "$URL" -o /tmp/nats-server.tar.gz
          tar -xzf /tmp/nats-server.tar.gz -C /tmp
          sudo install "/tmp/nats-server-${NATS_VERSION}-linux-amd64/nats-server" /usr/local/bin/nats-server
          nats-server --version
      - name: run the e2e suite against a real JetStream
        run: |
          nats-server -js -p 4222 -sd "$RUNNER_TEMP/nats" &
          sleep 1
          cargo test -p br-jobs-runner-kit --test e2e --locked -- --ignored --test-threads=1
      - name: run the br-runner-threads e2e tests against a real JetStream
        run: cargo test -p br-runner-threads --locked -- --ignored --test-threads=1
      - name: run the br-runner-connection e2e tests against a real NATS
        run: cargo test -p br-runner-connection --locked -- --ignored --test-threads=1
      - name: run the br-runner-jobs e2e tests against a real JetStream
        run: cargo test -p br-runner-jobs --locked -- --ignored --test-threads=1

  changelog:
    name: changelog + readme pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: a change to a frozen crate or the workspace requires a CHANGELOG.md update
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request — nothing to diff."
            exit 0
          fi
          source .github/scripts/tracked-libraries.sh
          git fetch origin "${{ github.base_ref }}" --quiet
          changed="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          echo "$changed"
          paths='Cargo\.toml$|Cargo\.lock$'
          for entry in $FROZEN_CRATES; do
            paths="${paths}|crates/${entry%@*}/"
          done
          if echo "$changed" | grep -qE "^(${paths})" && ! echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "::error::a frozen crate, Cargo.toml or Cargo.lock changed without a CHANGELOG.md entry"
            exit 1
          fi
      - name: check changelog entries
        run: |
          set -euo pipefail
          source .github/scripts/tracked-libraries.sh
          for crate in $TRACKED_LIBRARIES; do
            bash .github/scripts/check-changelog.sh "$crate"
          done
      - name: check README tag pins are fresh
        run: |
          set -euo pipefail
          source .github/scripts/tracked-libraries.sh
          for crate in $TRACKED_LIBRARIES; do
            bash .github/scripts/check-readme-pins.sh "$crate"
          done
      - name: br-runner-connection reaches no br-llm-clients library
        run: bash .github/scripts/check-no-llm-clients.sh br-runner-connection
      - name: br-runner-jobs reaches only br-llm-clients-core
        run: bash .github/scripts/check-no-llm-clients.sh br-runner-jobs --allow br-llm-clients-core
      - name: br-runner-as-tool reaches only br-llm-clients-core
        run: bash .github/scripts/check-no-llm-clients.sh br-runner-as-tool --allow br-llm-clients-core
      - name: br-runner-jobs keeps the bus in runner_transport and names no subject
        run: bash .github/scripts/check-bus-access.sh br-runner-jobs runner_transport

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck --severity=warning .github/scripts/*.sh

  release-tooling:
    name: release-line law and registry wiring tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: release-line decision table
        run: bash .github/scripts/test-release-line.sh
      - name: release detection and registry wiring
        run: bash .github/scripts/test-release-pipeline.sh
      - name: registry gate, tag and record wiring
        run: bash .github/scripts/test-registry-wiring.sh
      - name: a version released before the registry chain
        run: bash .github/scripts/test-released-before-registry.sh
      - name: gate, computation, tag and record order
        run: bash .github/scripts/test-release-order.sh
      - name: a second library joins, a frozen crate stays out
        run: bash .github/scripts/test-second-library.sh
      - name: test the br-llm-clients dependency gate
        run: bash .github/scripts/test-no-llm-clients.sh
      - name: test the bus access gate
        run: bash .github/scripts/test-check-bus-access.sh

  registry-gate:
    name: registry gate
    if: github.event_name == 'pull_request' && (github.base_ref == 'main' || startsWith(github.base_ref, 'release/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: release-line law and registry gate for every bumped tracked crate
        env:
          BASE_REF: ${{ github.base_ref }}
          BR_REGISTRY_KEY: ${{ secrets.BR_REGISTRY_KEY }}
        run: bash .github/scripts/pr-registry-gate.sh

  trufflehog:
    name: trufflehog (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51 # v3.95.5
        with:
          extra_args: --results=verified,unknown
