name: release-tags

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-tags
  cancel-in-progress: false

jobs:
  tag:
    name: Auto-tag the workspace version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Gate on a changelog entry for the workspace version
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "::error file=Cargo.toml::could not extract [workspace.package] version"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if grep -m1 -qF "## [${version}]" CHANGELOG.md; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v${version} has no '## [${version}]' changelog entry — not releasing"
          fi

      - name: Verify the changelog entry
        if: steps.gate.outputs.release == 'true'
        run: bash .github/scripts/check-changelog.sh

      - name: Tag and release the workspace version
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.gate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          changelog="CHANGELOG.md"
          tag="v${VERSION}"

          if git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "✓ tag ${tag} already exists"
          else
            echo "→ creating tag ${tag}"
            git tag -a "${tag}" \
              -m "br-jobs-runner-kit ${VERSION}" \
              -m "Auto-tagged from main. See ${changelog} for the entry."
            git push origin "${tag}"
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "✓ release ${tag} already exists"
          else
            echo "→ creating release ${tag}"
            notes_file=$(mktemp)
            awk -v target="## [${VERSION}]" '
              index($0, target) == 1 { in_section = 1; print; next }
              in_section && index($0, "## [") == 1 { exit }
              in_section { print }
            ' "$changelog" > "$notes_file"
            if [ ! -s "$notes_file" ]; then
              echo "::warning file=${changelog}::could not extract notes for ${tag}; using placeholder"
              printf 'See [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md) for changes.\n' \
                "$GITHUB_REPOSITORY" "$tag" > "$notes_file"
            fi
            gh release create "${tag}" \
              --title "br-jobs-runner-kit ${VERSION}" \
              --notes-file "$notes_file" \
              --verify-tag
            rm -f "$notes_file"
          fi
