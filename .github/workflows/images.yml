name: images

on:
  pull_request:
    paths:
      - "images/**"
      - ".dockerignore"
      - ".github/workflows/images.yml"
      - ".github/scripts/images-*.sh"
      - ".github/scripts/test-images-plan.sh"
      - ".github/scripts/test-tools-image*.sh"
  push:
    branches: [main]
    paths:
      - "images/**"
      - ".dockerignore"
      - ".github/workflows/images.yml"
      - ".github/scripts/images-*.sh"
      - ".github/scripts/test-images-plan.sh"
      - ".github/scripts/test-tools-image*.sh"
  workflow_dispatch:
    inputs:
      image:
        description: Image name (a folder of images/ with a Dockerfile); empty builds all
        type: string
        default: ""
      push:
        description: Push the images to ghcr.io
        type: boolean
        default: false
  workflow_call:
    inputs:
      image:
        type: string
        default: ""
      push:
        type: boolean
        default: true
    outputs:
      digests:
        description: JSON object, image name to registry reference with the manifest list digest
        value: ${{ jobs.digests.outputs.digests }}
      tag:
        description: Tag given to the pushed images
        value: ${{ jobs.plan.outputs.tag }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.discover.outputs.images }}
      push: ${{ steps.plan.outputs.push }}
      tag: ${{ steps.plan.outputs.tag }}
      revision: ${{ steps.plan.outputs.revision }}
      registry: ${{ steps.plan.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: policy and discovery tests
        run: bash .github/scripts/test-images-plan.sh
      - name: discover images
        id: discover
        env:
          IMAGE_INPUT: ${{ inputs.image }}
        run: echo "images=$(bash .github/scripts/images-discover.sh "$IMAGE_INPUT")" >>"$GITHUB_OUTPUT"
      - name: decide the push and the tag
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF: ${{ github.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTOR: ${{ github.actor }}
          PUSH_INPUT: ${{ inputs.push }}
          IMAGES: ${{ steps.discover.outputs.images }}
        run: |
          bash .github/scripts/images-plan.sh >plan.txt
          grep -E '^(push|tag|revision|registry)=' plan.txt >>"$GITHUB_OUTPUT"
          {
            echo "### Image plan"
            echo
            echo "Images: \`${IMAGES}\`"
            echo
            sed 's/^/- /' plan.txt
          } >>"$GITHUB_STEP_SUMMARY"

  build:
    name: build and test ${{ matrix.image }} ${{ matrix.platform }}
    needs: plan
    if: needs.plan.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: name of the local image and of the cache scope
        id: names
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          arch="${PLATFORM#linux/}"
          echo "local=local/${IMAGE}:${arch}" >>"$GITHUB_OUTPUT"
          echo "scope=${IMAGE}-${arch}" >>"$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/${{ matrix.image }}/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ steps.names.outputs.local }}
          build-args: |
            REVISION=${{ needs.plan.outputs.revision }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.plan.outputs.tag }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.revision }}
          cache-from: type=gha,scope=${{ steps.names.outputs.scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.names.outputs.scope }}
      - name: labels of the image
        env:
          LOCAL_IMAGE: ${{ steps.names.outputs.local }}
        run: bash .github/scripts/images-check-labels.sh "$LOCAL_IMAGE"
      - name: tests of the image
        if: hashFiles(format('images/{0}/test.sh', matrix.image)) != ''
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          LOCAL_IMAGE: ${{ steps.names.outputs.local }}
          PLATFORM: ${{ matrix.platform }}
          RESULTS_FILE: ${{ runner.temp }}/test-results.txt
        run: bash "images/${IMAGE}/test.sh" "$LOCAL_IMAGE" "$PLATFORM"
      - name: results of the tests in the summary
        if: always() && hashFiles(format('images/{0}/test.sh', matrix.image)) != ''
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          RESULTS_FILE: ${{ runner.temp }}/test-results.txt
        run: |
          {
            echo "### Tests of ${IMAGE} on ${PLATFORM}"
            echo
            echo '```'
            if [ -f "$RESULTS_FILE" ]; then cut -c1-700 "$RESULTS_FILE"; fi
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  push:
    name: push ${{ matrix.image }}
    needs: [plan, build]
    if: needs.plan.outputs.push == 'true' && needs.plan.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          file: images/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ needs.plan.outputs.registry }}/${{ matrix.image }}:${{ needs.plan.outputs.tag }}
          build-args: |
            REVISION=${{ needs.plan.outputs.revision }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.plan.outputs.tag }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.revision }}
          cache-from: |
            type=gha,scope=${{ matrix.image }}-amd64
            type=gha,scope=${{ matrix.image }}-arm64
      - name: record the manifest list digest
        env:
          IMAGE: ${{ matrix.image }}
          REGISTRY: ${{ needs.plan.outputs.registry }}
          TAG: ${{ needs.plan.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: bash .github/scripts/images-record-digest.sh "$IMAGE" "$REGISTRY" "$TAG" "$DIGEST" digests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}
          path: digests/${{ matrix.image }}.ref
          if-no-files-found: error

  digests:
    name: digests
    needs: [plan, push]
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.collect.outputs.digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: collected
          merge-multiple: true
      - name: collect
        id: collect
        run: |
          json="$(bash .github/scripts/images-collect-digests.sh collected)"
          echo "digests=${json}" >>"$GITHUB_OUTPUT"
          {
            echo "### Pushed images"
            echo
            echo '```json'
            echo "${json}"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
