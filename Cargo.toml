[workspace]
resolver = "3"
members = ["crates/br-jobs-runner-core", "crates/br-jobs-runner-kit", "crates/br-runner-toolkit"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/BotResources/br-jobs-runner-kit"

[workspace.dependencies]
br-jobs-runner-core = { path = "crates/br-jobs-runner-core", version = "0.1.0" }
async-nats = "0.48"
chrono = { version = "0.4", features = ["serde"] }
contract-jobs = { git = "https://github.com/BotResources/svc-jobs", tag = "contract-jobs/v0.1.0", version = "0.1.0" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }
br-agentic-contract = { git = "https://github.com/BotResources/br-llm-graph-rs", package = "br-agentic-contract", tag = "br-agentic-contract/v0.1.0", version = "0.1.0" }
br-graph-contract = { git = "https://github.com/BotResources/br-llm-graph-rs", package = "br-graph-contract", tag = "br-graph-contract/v0.1.0", version = "0.1.0" }
br-graph-executor = { git = "https://github.com/BotResources/br-llm-graph-rs", package = "br-graph-executor", tag = "br-graph-executor/v0.1.0", version = "0.1.0" }
br-llm-clients-core = { git = "https://github.com/BotResources/br-llm-clients-rs", package = "br-llm-clients-core", tag = "br-llm-clients-core/v0.5.0", version = "0.5.0" }
br-llm-messages = { git = "https://github.com/BotResources/br-llm-messages-rs", package = "br-llm-messages", tag = "br-llm-messages/v2.1.0", version = "2.1.0" }
br-runner-threads = { git = "https://github.com/BotResources/br-jobs-runner-kit", package = "br-runner-threads", branch = "feat/runner-threads/0-1", version = "0.1.0" }
