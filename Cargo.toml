[workspace]
resolver = "3"
members = ["crates/br-jobs-runner-core", "crates/br-jobs-runner-kit", "crates/br-runner-threads", "crates/br-runner-connection", "crates/br-runner-jobs", "crates/br-runner-as-node", "crates/br-runner-as-tool", "crates/br-runner-toolkit"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/BotResources/br-jobs-runner-kit"

[workspace.dependencies]
br-jobs-runner-core = { path = "crates/br-jobs-runner-core", version = "0.1.0" }
async-nats = "0.48"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1.12", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
chrono = { version = "0.4", features = ["serde"] }
contract-jobs = { git = "https://github.com/BotResources/svc-jobs", tag = "contract-jobs/v0.1.0", version = "0.1.0" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }
br-agentic-contract = { git = "https://github.com/BotResources/br-llm-graph-rs", package = "br-agentic-contract", tag = "br-agentic-contract/v0.2.0", version = "0.2.0" }
br-core-events = { git = "https://github.com/BotResources/br-rust-common", package = "br-core-events", tag = "br-core-events/v0.1.0", version = "0.1.0" }
br-core-integration = { git = "https://github.com/BotResources/br-rust-common", package = "br-core-integration", tag = "br-core-integration/v0.1.0", version = "0.1.0" }
br-core-kernel = { git = "https://github.com/BotResources/br-rust-common", package = "br-core-kernel", tag = "br-core-kernel/v0.1.0", version = "0.1.0" }
br-llm-messages = { git = "https://github.com/BotResources/br-llm-messages-rs", package = "br-llm-messages", tag = "br-llm-messages/v2.1.0", version = "2.1.0" }
br-util-nats-fabric = { git = "https://github.com/BotResources/br-rust-common", package = "br-util-nats-fabric", tag = "br-util-nats-fabric/v0.1.0", version = "0.1.0" }
contract-threads = { git = "https://github.com/BotResources/svc-threads", package = "contract-threads", tag = "contract-threads/v0.6.0", version = "0.6.0" }
br-runner-connection = { git = "https://github.com/BotResources/br-jobs-runner-kit", package = "br-runner-connection", tag = "br-runner-connection/v0.1.1", version = "0.1.1" }
br-runner-jobs = { git = "https://github.com/BotResources/br-jobs-runner-kit", package = "br-runner-jobs", tag = "br-runner-jobs/v0.1.0", version = "0.1.0" }
br-graph-contract = { git = "https://github.com/BotResources/br-llm-graph-rs", package = "br-graph-contract", tag = "br-graph-contract/v0.1.0", version = "0.1.0" }
br-graph-executor = { git = "https://github.com/BotResources/br-llm-graph-rs", package = "br-graph-executor", tag = "br-graph-executor/v0.1.0", version = "0.1.0" }
br-llm-clients-core = { git = "https://github.com/BotResources/br-llm-clients-rs", package = "br-llm-clients-core", tag = "br-llm-clients-core/v0.5.0", version = "0.5.0" }

[patch."https://github.com/BotResources/br-jobs-runner-kit"]
br-runner-connection = { path = "crates/br-runner-connection" }
br-runner-jobs = { path = "crates/br-runner-jobs" }
