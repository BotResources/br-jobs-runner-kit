[package]
name = "br-runner-as-tool"
version = "0.3.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A runner type as a tool: the Tool of the agentic contract that makes another runner do a piece of work, in sync or background mode, through the caller handle of br-runner-jobs-client"

[dependencies]
br-agentic-contract = { git = "https://github.com/BotResources/br-llm-graph-rs", package = "br-agentic-contract", tag = "br-agentic-contract/v0.3.0", version = "0.3.0" }
br-llm-clients-core.workspace = true
br-llm-messages.workspace = true
br-runner-jobs-client = { git = "https://github.com/BotResources/br-jobs-runner-kit", package = "br-runner-jobs-client", tag = "br-runner-jobs-client/v0.1.1", version = "0.1.1" }
futures.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
br-graph-contract.workspace = true
br-runner-jobs-client = { git = "https://github.com/BotResources/br-jobs-runner-kit", package = "br-runner-jobs-client", tag = "br-runner-jobs-client/v0.1.1", version = "0.1.1", features = ["test-double"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
