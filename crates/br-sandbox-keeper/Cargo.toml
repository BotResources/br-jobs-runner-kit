[package]
name = "br-sandbox-keeper"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The controller of the sandbox pools: it sizes the warm pools, expires pods and saves, and reports a failing pool"

[lib]
name = "br_sandbox_keeper"
path = "src/lib.rs"

[[bin]]
name = "br-sandbox-keeper"
path = "src/main.rs"

[dependencies]
br-runner-sandbox.workspace = true
bytes.workspace = true
futures.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server"] }
hyper-util.workspace = true
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
k8s-openapi = { version = "0.29", default-features = false, features = ["v1_33"] }
kube = { version = "5.2", default-features = false, features = ["client", "rustls-tls", "ring"] }
object_store = { version = "0.14", default-features = false, features = ["aws-base", "reqwest", "ring"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }
url = "2"
uuid.workspace = true

[package.metadata.cargo-machete]
ignored = ["reqwest"]

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
br-agentic-harness-contract = { git = "https://github.com/BotResources/br-llm-graph-rs", package = "br-agentic-harness-contract", tag = "br-agentic-harness-contract/v0.2.0", version = "0.2.0" }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "test-util", "time"] }
