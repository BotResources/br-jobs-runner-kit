[package]
name = "br-runner-threads"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Threads side of a runner: the adapters of the thread port and the thread access of the agentic contract, with a durable-ready thread queue, over a typed client of the Threads service"

[features]
test-double = []

[dependencies]
async-nats.workspace = true
br-agentic-contract.workspace = true
br-core-events.workspace = true
br-core-integration.workspace = true
br-core-kernel.workspace = true
br-llm-messages.workspace = true
br-runner-connection.workspace = true
br-util-nats-fabric.workspace = true
chrono.workspace = true
contract-threads.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
uuid.workspace = true

[dev-dependencies]
br-runner-threads = { path = ".", version = ">=0.2.0", features = ["test-double"] }
futures.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
