[package]
name = "br-runner-wiring-example"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "An end-to-end wiring example of a runner: the toolkit, the jobs adapters, the Threads adapter and the harness over in-process doubles"

[dependencies]
br-agentic-contract = { git = "https://github.com/BotResources/br-llm-graph-rs", package = "br-agentic-contract", tag = "br-agentic-contract/v0.3.0", version = "0.3.0" }
br-agentic-harness = { git = "https://github.com/BotResources/br-llm-graph-rs", package = "br-agentic-harness", tag = "br-agentic-harness/v0.1.1", version = "0.1.1" }
br-agentic-harness-contract = { git = "https://github.com/BotResources/br-llm-graph-rs", package = "br-agentic-harness-contract", tag = "br-agentic-harness-contract/v0.1.0", version = "0.1.0" }
br-core-auth = { git = "https://github.com/BotResources/br-rust-common", package = "br-core-auth", tag = "br-core-auth/v0.1.0", version = "0.1.0" }
br-graph-contract.workspace = true
br-llm-messages.workspace = true
br-runner-jobs.workspace = true
br-runner-jobs-client = { workspace = true, features = ["test-double"] }
br-runner-threads = { workspace = true, features = ["test-double"] }
br-runner-toolkit = { workspace = true, features = ["test-host"] }
contract-jobs = { git = "https://github.com/BotResources/svc-jobs", package = "contract-jobs", tag = "contract-jobs/v0.8.0", version = "0.8.0", features = ["integration"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid.workspace = true

[lints.rust]
unsafe_code = "forbid"
