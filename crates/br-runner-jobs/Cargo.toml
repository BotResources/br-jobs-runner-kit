[package]
name = "br-runner-jobs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The jobs side of a runner: typed calls and feeds for the jobs service, a delivery queue per Run, and the adapters of the agent port and the inbox port of the agentic contract"

[features]
test-double = []

[dependencies]
async-nats.workspace = true
br-agentic-contract.workspace = true
br-core-auth = { git = "https://github.com/BotResources/br-rust-common", package = "br-core-auth", tag = "br-core-auth/v0.1.0", version = "0.1.0" }
br-core-events.workspace = true
br-core-integration.workspace = true
br-core-kernel.workspace = true
br-llm-messages.workspace = true
br-runner-connection.workspace = true
br-util-nats-fabric.workspace = true
chrono.workspace = true
contract-jobs = { git = "https://github.com/BotResources/svc-jobs", package = "contract-jobs", tag = "contract-jobs/v0.7.0", version = "0.7.0", features = ["integration"] }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util.workspace = true
uuid.workspace = true

[dev-dependencies]
br-runner-jobs = { path = ".", version = ">=0.1.0", features = ["test-double"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "test-util"] }
