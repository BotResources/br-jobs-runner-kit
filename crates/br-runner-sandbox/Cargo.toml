[package]
name = "br-runner-sandbox"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The adapter of the sandbox port of br-agentic-harness-contract: a pod of a pool of warm pods, a save and a restore of the work folder between turns, and the seed of the box"

[dependencies]
br-agentic-harness-contract = { git = "https://github.com/BotResources/br-llm-graph-rs", package = "br-agentic-harness-contract", tag = "br-agentic-harness-contract/v0.2.0", version = "0.2.0" }
bytes.workspace = true
chrono.workspace = true
futures.workspace = true
k8s-openapi = { version = "0.29", default-features = false, features = ["v1_33"] }
kube = { version = "5.2", default-features = false, features = ["client", "rustls-tls", "ring", "ws"] }
object_store = { version = "0.14", default-features = false, features = ["aws-base", "reqwest", "ring"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "rt", "sync", "time"] }
tracing.workspace = true
url = "2"
uuid.workspace = true
zstd = "0.13"

[package.metadata.cargo-machete]
ignored = ["reqwest"]

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "test-util"] }
